name: Deploy Legacy Search
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: legacy-search-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm test
      - run: npm run release
        env:
          ENQUIRY_ENDPOINT: ${{ vars.ENQUIRY_ENDPOINT }}
      - run: node scripts/check-endpoint.mjs
        env:
          ENQUIRY_ENDPOINT: ${{ vars.ENQUIRY_ENDPOINT }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

